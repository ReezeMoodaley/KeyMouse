[package]
name = "keymouse"
version = "0.1.0"
description = "Precise keyboard driven cursor control for Windows"
edition = "2021"
rust-version = "1.80"
default-run = "keymouse"

[features]
diagnostics = []

[[bin]]
name = "keymouse-diagnostics"
path = "src/diagnostic_main.rs"
required-features = ["diagnostics"]

[lib]
name = "keymouse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Magnification", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_Storage_FileSystem", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
